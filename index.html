<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promo Banner Challenge</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="challenge-header">
        <h1>挑戰：如何炮製 <span class="token">.promo-banner</span></h1>
      </header>

      <main class="promo-layout">
        <section class="promo-demo" aria-label="宣傳區塊示意圖">
          <div class="demo-stage">
            <div class="code-window">
              <div class="top-tabs" aria-hidden="true">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
              </div>

              <div class="code-snippet" aria-label="HTML code sample">
                <span class="code-line">
                  <span class="tag">&lt;aside</span>
                  <span class="attr"> class="promo-banner"</span>
                  <span class="tag">&gt;</span>
                </span>
                <span class="code-line indent-1">
                  <span class="tag">&lt;div&gt;</span>
                </span>
                <span class="code-line indent-2">
                  <span class="tag">&lt;p&gt;</span>
                  <span class="text">廣告文案</span>
                  <span class="tag">&lt;/p&gt;</span>
                </span>
                <span class="code-line indent-1">
                  <span class="tag">&lt;/div&gt;</span>
                </span>
                <span class="code-line">
                  <span class="tag">&lt;/aside&gt;</span>
                </span>
              </div>
            </div>
          </div>
        </section>

        <aside class="promo-rules" aria-label="規格說明">
          <p class="intro">請新增宣傳區塊；CSS 依下列規格自行完成。</p>

          <div class="rule-card">
            <div class="rule-label">手機</div>
            <div class="rule-content">寬度 88%；內容區：按紙張文字排版</div>
          </div>

          <div class="rule-card">
            <div class="rule-label">桌機</div>
            <div class="rule-content">768px 後改用 Flexbox 左右排列</div>
          </div>

          <div class="rule-card">
            <div class="rule-label">互動</div>
            <div class="rule-content">按鈕 hover 時改變背景色 1.05</div>
          </div>

          <div class="rule-card motion-card">
            <div class="rule-label">動畫</div>
            <div class="rule-content">promo-banner 套用 fade-up · 時間 0.8 秒</div>
          </div>

          <p class="limit">限制：不可修改 hero 、 event-list 或其他框架。</p>
        </aside>
      </main>
    </div>
  </body>
</html>
