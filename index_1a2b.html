<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1A2B 遊戲</title>
  <style>
    :root {
      --panel-blue: #163d4d;
      --panel-blue-deep: #102e3f;
      --panel-white: #f3f3f3;
      --panel-white-soft: rgba(255, 255, 255, 0.78);
      --ink: #0f0f10;
      --tile-light: #e8dcc2;
      --tile-mid: #d9b98f;
      --tile-shadow: rgba(90, 66, 39, 0.85);
      --btn-dark: rgba(17, 20, 25, 0.96);
      --field-bg: rgba(255, 255, 255, 0.9);
      --field-outline: rgba(20, 25, 30, 0.92);
      --dark-glass: rgba(8, 18, 27, 0.52);
      --wood-1: rgba(142, 96, 61, 0.68);
      --wood-2: rgba(80, 54, 35, 0.52);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(24, 46, 59, 0.75), rgba(17, 28, 37, 0.35)),
        radial-gradient(circle at 20% 10%, rgba(220, 170, 98, 0.20), transparent 16%),
        radial-gradient(circle at 58% 18%, rgba(192, 121, 77, 0.20), transparent 20%),
        linear-gradient(180deg, rgba(27, 49, 60, 0.94), rgba(16, 23, 31, 0.96));
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .game-shell {
      width: min(96vw, 1460px);
      height: min(92vh, 820px);
      display: grid;
      grid-template-columns: 1fr 1.55fr;
      background: rgba(13, 26, 36, 0.46);
      border: 3px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.42);
      overflow: hidden;
    }

    .panel {
      position: relative;
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    .left-panel {
      background: rgba(255, 255, 255, 0.76);
      border-right: 3px solid rgba(18, 52, 67, 0.95);
    }

    .right-panel {
      background:
        linear-gradient(180deg, rgba(77, 57, 41, 0.45), rgba(50, 34, 26, 0.38)),
        radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.12), transparent 20%),
        linear-gradient(120deg, rgba(31, 48, 58, 0.68), rgba(23, 20, 19, 0.55));
      background-blend-mode: screen, normal, normal;
    }

    .panel-header {
      height: 86px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.9rem, 2vw, 2.9rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1;
      color: #101010;
      background: rgba(255,255,255,0.22);
      border-bottom: 3px solid rgba(15, 15, 15, 0.08);
      text-shadow: 0 2px 0 rgba(255,255,255,0.35);
      user-select: none;
    }

    .left-card {
      flex: 1;
      margin: 16px 18px 18px;
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(17, 17, 17, 0.06);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
      overflow: hidden;
    }

    .history-list {
      width: 100%;
      height: 100%;
      padding: 18px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .history-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: rgba(0,0,0,0.30);
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(0,0,0,0.02);
      color: #181818;
      font-size: 1.15rem;
      font-weight: 700;
      border: 1px solid rgba(0,0,0,0.04);
    }

    .history-item .guess {
      letter-spacing: 0.12em;
    }

    .history-item .result {
      min-width: 78px;
      text-align: right;
      color: #203d63;
    }

    .right-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 14px 18px 18px;
    }

    .guess-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      min-height: 136px;
      padding-left: 4px;
    }

    .guess-display {
      flex: 1;
      height: 120px;
      background: rgba(255,255,255,0.85);
      border: 2px solid rgba(14, 20, 25, 0.9);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0d0d0d;
      font-size: clamp(2.9rem, 4vw, 4.8rem);
      font-weight: 800;
      letter-spacing: 0.15em;
      text-shadow: 0 1px 0 rgba(255,255,255,0.4);
      box-shadow: inset 0 0 8px rgba(0,0,0,0.04);
      user-select: none;
    }

    .guess-display.empty {
      color: rgba(15, 15, 15, 0.26);
      letter-spacing: 0.12em;
    }

    .submit-btn {
      width: 150px;
      height: 120px;
      border: 0;
      background: linear-gradient(180deg, rgba(18, 19, 22, 0.98), rgba(0,0,0,0.9));
      box-shadow: 0 7px 0 rgba(0,0,0,0.42);
      cursor: pointer;
      position: relative;
      border-radius: 10px;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .submit-btn::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-40%, -50%);
      width: 0;
      height: 0;
      border-top: 28px solid transparent;
      border-bottom: 28px solid transparent;
      border-left: 52px solid rgba(255,255,255,0.96);
    }

    .submit-btn:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 rgba(0,0,0,0.42);
    }

    .keypad {
      margin-top: 12px;
      width: min(92%, 720px);
      align-self: center;
      display: grid;
      grid-template-columns: repeat(4, minmax(100px, 1fr));
      gap: 16px 16px;
      padding: 20px 10px 12px;
      border-radius: 18px;
      background: rgba(19, 20, 18, 0.08);
    }

    .key {
      appearance: none;
      border: none;
      cursor: pointer;
      aspect-ratio: 1.05;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(241, 228, 194, 0.96), rgba(207, 168, 112, 0.95));
      box-shadow: inset 0 0 10px rgba(255,255,255,0.20), 0 6px 0 rgba(103, 76, 40, 0.78);
      color: #0e0e0e;
      font-size: clamp(2.1rem, 2vw, 3.7rem);
      font-weight: 900;
      font-family: inherit;
      line-height: 1;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      user-select: none;
    }

    .key:active {
      transform: translateY(4px);
      box-shadow: inset 0 0 10px rgba(255,255,255,0.18), 0 2px 0 rgba(103, 76, 40, 0.78);
    }

    .key.clear {
      position: relative;
      background: linear-gradient(180deg, rgba(242, 223, 185, 0.96), rgba(190, 139, 84, 0.96));
    }

    .key.clear::before {
      content: "◎";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2.2rem, 2.5vw, 3.3rem);
      font-weight: 900;
      color: rgba(17,17,17,0.9);
    }

    .key.clear span {
      opacity: 0;
    }

    .message {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      min-width: 200px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(15, 21, 29, 0.95);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.2);
    }

    .message.show {
      opacity: 1;
    }

    @media (max-width: 980px) {
      body {
        overflow: auto;
      }

      .game-shell {
        width: 100%;
        height: auto;
        display: flex;
        flex-direction: column;
      }

      .left-panel {
        border-right: none;
        border-bottom: 3px solid rgba(18, 52, 67, 0.95);
      }

      .keypad {
        grid-template-columns: repeat(4, minmax(70px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <section class="panel left-panel" aria-label="歷史紀錄區">
      <div class="panel-header">【--- 一狀態列 ---】</div>
      <div class="left-card">
        <div class="history-list" id="historyList">
          <div class="history-empty">尚未開始猜數字</div>
        </div>
      </div>
    </section>

    <section class="panel right-panel" aria-label="遊戲區">
      <div class="panel-header">【--- 您要猜的數字 ---】</div>

      <div class="right-content">
        <div class="guess-bar">
          <div id="guessDisplay" class="guess-display empty" aria-live="polite">_ _ _ _</div>
          <button id="submitBtn" class="submit-btn" type="button" aria-label="送出答案"></button>
        </div>

        <div class="keypad" aria-label="數字鍵盤">
          <button class="key" type="button" data-digit="0">0</button>
          <button class="key" type="button" data-digit="1">1</button>
          <button class="key" type="button" data-digit="2">2</button>
          <button class="key" type="button" data-digit="3">3</button>

          <button class="key" type="button" data-digit="4">4</button>
          <button class="key" type="button" data-digit="5">5</button>
          <button class="key" type="button" data-digit="6">6</button>
          <button class="key" type="button" data-digit="7">7</button>

          <button class="key" type="button" data-digit="8">8</button>
          <button class="key" type="button" data-digit="9">9</button>
          <button class="key clear" type="button" data-action="clear" aria-label="清除"><span>清除</span></button>
          <button class="key" type="button" data-action="submit" aria-label="確認">◎</button>
        </div>
      </div>
    </section>
  </div>

  <div id="message" class="message" aria-live="polite"></div>

  <script>
    const guessDisplay = document.getElementById('guessDisplay');
    const historyList = document.getElementById('historyList');
    const messageBox = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    let currentGuess = [];
    let secretCode = generateSecret();
    let rounds = 0;

    function generateSecret() {
      return Array.from({ length: 4 }, () => Math.floor(Math.random() * 10)).join('');
    }

    function updateDisplay() {
      if (currentGuess.length === 0) {
        guessDisplay.textContent = '_ _ _ _';
        guessDisplay.classList.add('empty');
        return;
      }

      const padded = Array.from({ length: 4 }, (_, index) => currentGuess[index] ?? '_');
      guessDisplay.textContent = padded.join(' ');
      guessDisplay.classList.remove('empty');
    }

    function showMessage(text) {
      messageBox.textContent = text;
      messageBox.classList.add('show');
      clearTimeout(showMessage.timeoutId);
      showMessage.timeoutId = setTimeout(() => {
        messageBox.classList.remove('show');
      }, 1500);
    }

    function addHistoryEntry(guess, result) {
      const item = document.createElement('div');
      item.className = 'history-item';

      const guessEl = document.createElement('div');
      guessEl.className = 'guess';
      guessEl.textContent = `${guess}`;

      const resultEl = document.createElement('div');
      resultEl.className = 'result';
      resultEl.textContent = result;

      item.appendChild(guessEl);
      item.appendChild(resultEl);
      historyList.prepend(item);

      const empty = historyList.querySelector('.history-empty');
      if (empty) empty.remove();
    }

    function handleDigit(digit) {
      if (currentGuess.length >= 4) return;
      currentGuess.push(String(digit));
      updateDisplay();
    }

    function clearGuess() {
      currentGuess = [];
      updateDisplay();
    }

    function evaluateGuess(guess) {
      const secretChars = secretCode.split('');
      const guessChars = guess.split('');
      const secretUsed = Array(4).fill(false);
      const guessUsed = Array(4).fill(false);

      let a = 0;
      let b = 0;

      for (let i = 0; i < 4; i++) {
        if (guessChars[i] === secretChars[i]) {
          a += 1;
          secretUsed[i] = true;
          guessUsed[i] = true;
        }
      }

      for (let i = 0; i < 4; i++) {
        if (guessUsed[i]) continue;
        for (let j = 0; j < 4; j++) {
          if (secretUsed[j]) continue;
          if (guessChars[i] === secretChars[j]) {
            b += 1;
            secretUsed[j] = true;
            guessUsed[i] = true;
            break;
          }
        }
      }

      return `${a}A${b}B`;
    }

    function submitGuess() {
      const guess = currentGuess.join('');

      if (guess.length !== 4) {
        showMessage('請輸入 4 位數字');
        return;
      }

      rounds += 1;
      const result = evaluateGuess(guess);
      addHistoryEntry(guess, result);

      if (result === '4A0B') {
        showMessage('恭喜你猜對了！');
        secretCode = generateSecret();
        rounds = 0;
      } else {
        showMessage(result);
      }

      clearGuess();
    }

    document.querySelectorAll('.key').forEach((button) => {
      button.addEventListener('click', () => {
        const digit = button.dataset.digit;
        const action = button.dataset.action;

        if (digit !== undefined) {
          handleDigit(digit);
          return;
        }

        if (action === 'clear') {
          clearGuess();
          return;
        }

        if (action === 'submit') {
          submitGuess();
        }
      });
    });

    submitBtn.addEventListener('click', submitGuess);
    updateDisplay();
  </script>
</body>
</html>
