<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1A2B 遊戲</title>
  <style>
    :root {
      --bg-deep: #0a1f33;
      --bg-mid: #0d2d4a;
      --panel-blue: #153d4e;
      --panel-blue-dark: #102d3d;
      --panel-light: #f1f1f1;
      --white: #f5f5f5;
      --black: #111111;
      --beige: #d8c7a2;
      --beige-dark: #b89c6d;
      --shadow: rgba(0, 0, 0, 0.28);
      --wood: #b57846;
      --panel-bg: rgba(255, 255, 255, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
      color: var(--black);
      background:
        radial-gradient(circle at 10% 10%, rgba(247, 173, 85, 0.15), transparent 30%),
        radial-gradient(circle at 80% 15%, rgba(129, 93, 52, 0.15), transparent 35%),
        linear-gradient(180deg, #1a2940 0%, #0d1b2d 100%);
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .game-shell {
      position: relative;
      width: min(95vw, 1480px);
      height: min(93vh, 820px);
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      border: 3px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.38);
      background: rgba(20, 36, 58, 0.7);
      backdrop-filter: blur(2px);
    }

    .panel {
      position: relative;
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    .left-panel {
      background: rgba(255, 255, 255, 0.9);
      border-right: 3px solid rgba(20, 52, 68, 0.9);
    }

    .right-panel {
      background:
        linear-gradient(180deg, rgba(147, 109, 76, 0.4), rgba(24, 38, 32, 0.18)),
        linear-gradient(90deg, rgba(17, 33, 43, 0.5), rgba(36, 24, 18, 0.32)),
        rgba(10, 35, 47, 0.8);
      background-size: cover;
    }

    .panel-header {
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      font-size: clamp(1.7rem, 2vw, 2.5rem);
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #0f0f0f;
      background: rgba(255, 255, 255, 0.28);
      border-bottom: 3px solid rgba(0, 0, 0, 0.08);
      text-shadow: 0 2px 0 rgba(255,255,255,0.35);
    }

    .right-panel .panel-header {
      color: #0d0d0d;
      background: rgba(215, 225, 232, 0.1);
      border-bottom-color: rgba(255,255,255,0.2);
    }

    .left-card {
      flex: 1;
      margin: 18px 18px 28px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 6px;
      border: 1px solid rgba(15, 15, 15, 0.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .history-list {
      width: 100%;
      height: 100%;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.025);
      color: #1b1b1b;
      font-size: 1.1rem;
      font-weight: 700;
      border: 1px solid rgba(0,0,0,0.04);
    }

    .history-item .guess {
      letter-spacing: 0.08em;
    }

    .history-item .result {
      font-size: 1.15rem;
      min-width: 86px;
      text-align: right;
      color: #213854;
    }

    .history-empty {
      color: rgba(0,0,0,0.32);
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
    }

    .right-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 18px 18px 22px;
      gap: 18px;
    }

    .guess-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      min-height: 130px;
      padding-left: 8px;
    }

    .guess-display {
      flex: 1;
      height: 112px;
      background: rgba(255,255,255,0.9);
      border: 2px solid rgba(10, 18, 24, 0.85);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      font-size: clamp(2.8rem, 5vw, 5rem);
      font-weight: 800;
      letter-spacing: 0.14em;
      color: #111;
      box-shadow: inset 0 0 14px rgba(0,0,0,0.03);
      min-width: 0;
    }

    .guess-display.empty {
      color: rgba(17,17,17,0.18);
      font-size: clamp(1.9rem, 3vw, 3rem);
      letter-spacing: 0.08em;
    }

    .submit-btn {
      width: 146px;
      height: 112px;
      border: none;
      border-radius: 10px 10px 10px 10px;
      background: linear-gradient(180deg, rgba(19, 28, 32, 0.98), rgba(0,0,0,0.9));
      box-shadow: 0 8px 0 rgba(0,0,0,0.4);
      position: relative;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .submit-btn::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-top: 28px solid transparent;
      border-bottom: 28px solid transparent;
      border-left: 52px solid rgba(255,255,255,0.96);
      transform: translate(-34%, -50%);
    }

    .submit-btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 rgba(0,0,0,0.4);
    }

    .keypad {
      align-self: center;
      display: grid;
      grid-template-columns: repeat(4, minmax(112px, 1fr));
      gap: 18px 18px;
      width: min(90%, 720px);
      padding: 26px 12px 8px;
      border-radius: 18px;
      background: rgba(0,0,0,0.1);
      box-shadow: inset 0 0 12px rgba(255,255,255,0.04);
    }

    .key {
      appearance: none;
      border: none;
      cursor: pointer;
      aspect-ratio: 1.1;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(245, 229, 186, 0.95), rgba(203, 167, 103, 0.95));
      box-shadow: inset 0 0 10px rgba(255,255,255,0.2), 0 6px 0 rgba(111, 79, 42, 0.7);
      color: #111;
      font-size: clamp(2.3rem, 3vw, 4rem);
      font-weight: 900;
      line-height: 1;
      font-family: inherit;
      transition: transform 0.1s ease, filter 0.15s ease;
      user-select: none;
    }

    .key:active {
      transform: translateY(4px);
      box-shadow: inset 0 0 10px rgba(255,255,255,0.2), 0 2px 0 rgba(111, 79, 42, 0.7);
    }

    .key.clear {
      background: linear-gradient(180deg, rgba(245, 219, 170, 0.95), rgba(188, 134, 80, 0.95));
      position: relative;
    }

    .key.clear::before {
      content: "◎";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2.6rem, 3vw, 3.5rem);
      font-weight: 900;
      color: rgba(17,17,17,0.9);
    }

    .key.clear span {
      opacity: 0;
    }

    .message {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      min-width: 180px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(25, 37, 52, 0.95);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .message.show {
      opacity: 1;
    }

    @media (max-width: 980px) {
      body {
        overflow: auto;
      }

      .game-shell {
        width: 100%;
        height: auto;
        display: flex;
        flex-direction: column;
      }

      .left-panel,
      .right-panel {
        min-height: 420px;
      }

      .left-panel {
        border-right: none;
        border-bottom: 3px solid rgba(20, 52, 68, 0.9);
      }

      .keypad {
        grid-template-columns: repeat(4, minmax(72px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <section class="panel left-panel" aria-label="歷史紀錄區">
      <div class="panel-header">【--- 一狀態列 ---】</div>
      <div class="left-card">
        <div class="history-list" id="historyList">
          <div class="history-empty">尚未開始猜數字</div>
        </div>
      </div>
    </section>

    <section class="panel right-panel" aria-label="遊戲區">
      <div class="panel-header">【--- 您要猜的數字 ---】</div>

      <div class="right-content">
        <div class="guess-bar">
          <div id="guessDisplay" class="guess-display empty" aria-live="polite">_ _ _ _</div>
          <button id="submitBtn" class="submit-btn" type="button" aria-label="送出答案"></button>
        </div>

        <div class="keypad" aria-label="數字鍵盤">
          <button class="key" type="button" data-digit="0">0</button>
          <button class="key" type="button" data-digit="1">1</button>
          <button class="key" type="button" data-digit="2">2</button>
          <button class="key" type="button" data-digit="3">3</button>

          <button class="key" type="button" data-digit="4">4</button>
          <button class="key" type="button" data-digit="5">5</button>
          <button class="key" type="button" data-digit="6">6</button>
          <button class="key" type="button" data-digit="7">7</button>

          <button class="key" type="button" data-digit="8">8</button>
          <button class="key" type="button" data-digit="9">9</button>
          <button class="key clear" type="button" data-action="clear" aria-label="清除"><span>清除</span></button>
          <button class="key" type="button" data-action="submit" aria-label="確認">◎</button>
        </div>
      </div>
    </section>
  </div>

  <div id="message" class="message" aria-live="polite"></div>

  <script>
    const guessDisplay = document.getElementById('guessDisplay');
    const historyList = document.getElementById('historyList');
    const messageBox = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    let currentGuess = [];
    let secretCode = generateSecret();
    let rounds = 0;

    function generateSecret() {
      return Array.from({ length: 4 }, () => Math.floor(Math.random() * 10)).join('');
    }

    function updateDisplay() {
      if (currentGuess.length === 0) {
        guessDisplay.textContent = '_ _ _ _';
        guessDisplay.classList.add('empty');
        return;
      }

      const padded = Array.from({ length: 4 }, (_, index) => currentGuess[index] ?? '_');
      guessDisplay.textContent = padded.join(' ');
      guessDisplay.classList.remove('empty');
    }

    function showMessage(text) {
      messageBox.textContent = text;
      messageBox.classList.add('show');
      clearTimeout(showMessage.timeoutId);
      showMessage.timeoutId = setTimeout(() => {
        messageBox.classList.remove('show');
      }, 1500);
    }

    function addHistoryEntry(guess, result) {
      const item = document.createElement('div');
      item.className = 'history-item';

      const guessEl = document.createElement('div');
      guessEl.className = 'guess';
      guessEl.textContent = `${guess}`;

      const resultEl = document.createElement('div');
      resultEl.className = 'result';
      resultEl.textContent = result;

      item.appendChild(guessEl);
      item.appendChild(resultEl);
      historyList.prepend(item);

      const empty = historyList.querySelector('.history-empty');
      if (empty) empty.remove();
    }

    function handleDigit(digit) {
      if (currentGuess.length >= 4) return;
      currentGuess.push(String(digit));
      updateDisplay();
    }

    function clearGuess() {
      currentGuess = [];
      updateDisplay();
    }

    function evaluateGuess(guess) {
      let a = 0;
      let b = 0;
      const guessChars = guess.split('');

      for (let i = 0; i < 4; i++) {
        if (guessChars[i] === secretCode[i]) {
          a += 1;
        }
      }

      for (let i = 0; i < 4; i++) {
        if (secretCode.includes(guessChars[i])) {
          const secretCount = secretCode.split('').filter((v) => v === guessChars[i]).length;
          const guessCount = guess.split('').filter((v) => v === guessChars[i]).length;
          const overlap = Math.min(secretCount, guessCount);
          b += overlap;
        }
      }

      b -= a;
      return `${a}A${b}B`;
    }

    function submitGuess() {
      const guess = currentGuess.join('');

      if (guess.length !== 4) {
        showMessage('請輸入 4 位數字');
        return;
      }

      rounds += 1;
      const result = evaluateGuess(guess);
      addHistoryEntry(guess, result);

      if (result === '4A0B') {
        showMessage('恭喜你猜對了！');
        secretCode = generateSecret();
        rounds = 0;
      } else {
        showMessage(result);
      }

      clearGuess();
    }

    document.querySelectorAll('.key').forEach((button) => {
      button.addEventListener('click', () => {
        const digit = button.dataset.digit;
        const action = button.dataset.action;

        if (digit !== undefined) {
          handleDigit(digit);
          return;
        }

        if (action === 'clear') {
          clearGuess();
          return;
        }

        if (action === 'submit') {
          submitGuess();
        }
      });
    });

    submitBtn.addEventListener('click', submitGuess);
    updateDisplay();
  </script>
</body>
</html>
